# Construit l'APK à chaque modification envoyée sur main, et le publie dans les « Releases ».
# Lien de téléchargement direct (toujours la dernière version) :
#   https://github.com/sweed92/DeckZ/releases/latest/download/DeckZ.apk
name: Construire l'APK

on:
  push:
    branches: [main]
  workflow_dispatch: # bouton « Run workflow » dans l'onglet Actions

permissions:
  contents: write # nécessaire pour publier la release

concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Vérifier la clé de signature
        env:
          KEYSTORE_BASE64: ${{ secrets.DECKZ_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.DECKZ_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::Secrets DECKZ_KEYSTORE_BASE64 et DECKZ_KEYSTORE_PASSWORD manquants (Settings > Secrets and variables > Actions)."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/deckz.jks"

      - name: Compiler
        env:
          DECKZ_KEYSTORE: ${{ runner.temp }}/deckz.jks
          DECKZ_KEYSTORE_PASSWORD: ${{ secrets.DECKZ_KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug -PdeckzVersionName=1.0.${{ github.run_number }}
          cp app/build/outputs/apk/debug/app-debug.apk DeckZ.apk

      - name: Publier la release
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ github.event.head_commit.message || 'Construction manuelle' }}
        run: |
          gh release create "v1.0.${{ github.run_number }}" DeckZ.apk \
            --title "DeckZ 1.0.${{ github.run_number }}" \
            --notes "$NOTES" \
            --latest
